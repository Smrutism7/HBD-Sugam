<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#351525">
<title>Project SUGAM | A Little Mystery</title>
<style>
:root{--wine:#351525;--plum:#4a2338;--gold:#d6b574;--cream:#fff6eb;--muted:#d8c6ce;--card:rgba(255,246,235,.07);--line:rgba(214,181,116,.32)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#593047 0%,#351525 48%,#21101b 100%);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(100%,650px);margin:auto}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--gold);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;margin:0 0 20px}
.badge{border:1px solid var(--line);border-radius:99px;padding:8px 11px;white-space:nowrap}
.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,246,235,.09),rgba(255,246,235,.035));border-radius:24px;padding:clamp(24px,6vw,48px);box-shadow:0 24px 80px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.eyebrow{color:var(--gold);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;line-height:1.12;margin:0 0 18px}
h1{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:-.04em}
h2{font-size:clamp(2rem,7vw,3rem)}
p{line-height:1.75;color:var(--muted);font-size:1.02rem}
.lead{font-size:1.12rem;color:var(--cream)}
.rule{height:1px;background:var(--line);margin:26px 0}
button,.button{font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer;border:0;border-radius:12px;padding:15px 19px;background:var(--gold);color:#28131e;display:inline-flex;justify-content:center;align-items:center;text-decoration:none;transition:transform .2s,filter .2s;width:100%;margin-top:12px}
button:hover,.button:hover{transform:translateY(-2px);filter:brightness(1.05)}
.secondary{background:transparent;color:var(--cream);border:1px solid var(--line)}
label{display:block;color:var(--cream);font-size:.92rem;margin:22px 0 8px}
input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--cream);font:inherit;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,181,116,.12)}
.feedback{min-height:26px;color:var(--gold);font-size:.92rem;margin:12px 0 0}
.ornament{color:var(--gold);font-size:1.7rem;margin:0 0 16px;letter-spacing:.35em}
.hidden{display:none!important}
.note{font-size:.84rem;color:var(--muted);opacity:.9}
.reveal{background:linear-gradient(145deg,rgba(214,181,116,.13),rgba(255,246,235,.04))}
.qr-placeholder{margin:24px auto 8px;padding:16px;border:1px dashed var(--line);border-radius:16px;text-align:center;max-width:260px;color:var(--gold)}
a{color:var(--gold)}
@media(max-width:480px){body{padding:14px}.topline{font-size:.64rem}.card{border-radius:19px}}

/* Celebration: matches the existing wine-and-gold birthday theme */
#celebration{position:fixed;inset:0;z-index:1000;background:rgba(33,16,27,.96);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
#celebration.active{display:flex}
#celebration .celebration-content{position:relative;z-index:2;max-width:520px;animation:partyPop .65s ease both}
#celebration h2{color:var(--cream)}
#celebration .party-icon{font-size:3.4rem;margin-bottom:18px}
#celebration .party-piece{position:absolute;top:-60px;pointer-events:none;animation:partyFall linear forwards}
#celebration .party-balloon{position:absolute;bottom:-90px;pointer-events:none;animation:partyFloat linear forwards}
@keyframes partyFall{to{transform:translateY(115vh) rotate(650deg);opacity:0}}
@keyframes partyFloat{to{transform:translateY(-120vh) rotate(15deg);opacity:0}}
@keyframes partyPop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){#celebration .party-piece,#celebration .party-balloon{animation:none;display:none}#celebration .celebration-content{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="topline"><span>Project SUGAM</span><span class="badge">Classified · Birthday Edition</span></div>
  <section class="card" id="app" aria-live="polite"></section>
  <p class="note" style="text-align:center;margin-top:16px">A little mystery, made with love. ♥</p>
</main>
<div id="celebration" role="dialog" aria-modal="true" aria-labelledby="party-title">
  <div class="celebration-content">
    <div class="party-icon" aria-hidden="true">🎉 🎈 ✨</div>
    <p class="eyebrow">Project SUGAM · Special checkpoint</p>
    <h2 id="party-title">You found it, detective!</h2>
    <p class="lead" id="party-message">A little surprise is waiting for you. Enjoy this moment! ♥</p>
    <button id="party-continue" type="button">CONTINUE THE MISSION ↗</button>
  </div>
</div>
<script>
/*
  SETUP NOTE:
  1) The song is revealed physically in a framed gift, not on this website.
  2) Open qr-cards.html after uploading this folder to hosting.
  3) QR links use ?stage=1 through ?stage=9.
*/
const stages = {
  1: {
    title:"The silent storytellers",
    clue:"I hold many worlds but never travel. My silent secrets are yours to unravel. My friends stand in rows, with stories to tell. Where do these paper storytellers gather?",
    answers:["bookshelf","book shelf","books","bookcase","the bookshelf"],
    destination:"Head to the bookshelf. Look for a small QR card tucked nearby.",
    wrong:"Close, but no case closed yet. Look for a home where stories stand side by side."
  },
  2: {
    title:"The everyday companions",
    clue:"Before you step out to conquer the day, your companions patiently wait. They come in pairs and never complain. Where do they stay?",
    answers:["shoe rack","shoes","shoe shelf","the shoe rack","entryway shoe rack"],
    destination:"Go to the shoe rack. Search carefully around the shoes and nearby boxes.",
    wrong:"Try again. They're a pair-loving bunch that helps you get out the door."
  },
  3: {
    title:"A chilly personality",
    clue:"I keep things fresh and have a chilly personality. I guard snacks, leftovers, and midnight decisions. What am I?",
    answers:["refrigerator","fridge","the fridge","the refrigerator"],
    destination:"Visit the refrigerator. Your next QR card is waiting nearby—not inside anything that could get wet.",
    wrong:"Brrr… you're looking for the place that keeps food cold."
  },
  4: {
    title:"The daily decision",
    clue:"Some things are folded, some hang with care. Some are favorites you choose to wear. Find the place where your daily outfit decisions live.",
    answers:["wardrobe","closet","clothes closet","the wardrobe","his wardrobe"],
    destination:"Go to your wardrobe and look behind the folded clothes for the next QR card.",
    wrong:"Not the laundry basket, detective. Think of where clothes are stored and chosen."
  },
  5: {
    title:"A well-earned break",
    clue:"I welcome movie nights, scrolling sessions, naps, and long conversations. I take the weight off your feet. Where am I?",
    answers:["sofa","couch","the sofa","the couch"],
    destination:"Head to the sofa. Check around the cushions and nearby side table for your next QR card.",
    wrong:"Take a seat and think about the comfiest spot in the living room."
  },
  6: {
    title:"The clever corner",
    clue:"Little lights blink, buttons click, and wires sometimes mysteriously disappear. A curious mind feels right at home here. Where should you investigate?",
    answers:["electronics area","desk","computer desk","gaming area","hobby area","electronics","tech area","his desk","work desk"],
    destination:"Go to your electronics, desk, or hobby area. Look around your usual gadgets for the next QR card.",
    wrong:"Think of the place where your gadgets, tech, or hobby gear live."
  },
  7: {
    title:"Where we gather",
    clue:"A place for stories, laughter, and something to eat. We gather here when it's time to dine. Where do our plates meet?",
    answers:["dining table","table","kitchen table","the dining table"],
    destination:"Go to the dining table. Look underneath or around it for your next QR card.",
    wrong:"You're hungry for the answer! Think of where we sit down for a meal."
  },
  8: {
    title:"One last quiet corner",
    clue:"The day is nearly done, and dreams are close at hand. Beside the place where we rest, a little hiding spot is waiting. Look inside the drawer nearby. Where am I?",
    answers:["bedside drawer","nightstand","nightstand drawer","bedside table","side table","bedside cabinet","drawer"],
    destination:"CASE CLOSED! ♥ You solved the final mystery. Your last destination is the bedside drawer. Go discover what is waiting for you there. Happy Birthday, Sugam!",
    wrong:"Think of the little drawer beside the bed."
  }
};
const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const stage = Number(params.get("stage") || 0);
const clean = s => s.toLowerCase().trim().replace(/[’']/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");
function home(){
 app.innerHTML = `<div class="ornament">✦ ✧ ✦</div><p class="eyebrow">A birthday case file</p><h1>A little<br>mystery for you.</h1>
 <p class="lead">Hey, birthday boy. ♥</p>
 <p>An unusual situation has been reported. Someone has planned something for you. The details are classified, and the suspect is suspiciously close to you.</p>
 <p>No shortcuts. No asking your wife for hints. (We know how you are.)</p>
 <div class="rule"></div><p>Trust your instincts. Follow the clues. Let's see how good your detective skills really are.</p>
 <button id="begin">ACCEPT THE MISSION ↗</button>`;
 document.getElementById("begin").onclick = () => { history.replaceState(null,"",location.pathname); showStage(0); };
}
function showStage(n){
 if(n===0){
   app.innerHTML = `<div class="ornament">✦ ✧ ✦</div><p class="eyebrow">Mission activated</p><h2>Detective, you're in.</h2><p class="lead">Your case file is now open. ♥</p><p>Your first QR card is waiting at the <strong>bathroom mirror</strong>. Find it and scan to unlock your first riddle.</p><div class="rule"></div><p class="note">Each QR scan reveals a new riddle. Solve it to discover where to go next.</p>`;
   return;
 }
 if(n>=1 && n<=8){
   const s=stages[n];
   app.innerHTML = `<p class="eyebrow">A new lead</p><h2>${s.title}</h2><p class="lead">${s.clue}</p><div class="rule"></div><label for="answer">What is your answer?</label><input id="answer" autocomplete="off" placeholder="Type your answer…"><button id="check">CHECK MY ANSWER</button><p class="feedback" id="feedback"></p><p class="note">Hint: read it twice before accusing the furniture.</p>`;
   document.getElementById("check").onclick = () => checkAnswer(s.answers,s.destination,s.wrong);
   document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("check").click()});
   return;
 }
 home();
}
function checkAnswer(answers,destination,wrong){
 const input = clean(document.getElementById("answer").value);
 const fb = document.getElementById("feedback");
 if(answers.some(a=>clean(a)===input)){
   fb.textContent = "Correct. Okay, detective… not bad. 😏";
   const old = document.getElementById("destination");
   if(old)old.remove();
   const p=document.createElement("p");p.id="destination";p.className="lead";p.style.marginTop="18px";p.textContent=destination;
   document.getElementById("check").after(p);
   document.getElementById("check").textContent="CASE NOTE RECEIVED ✓";
   document.getElementById("check").disabled=true;
   if(stage===8) launchCelebration("You solved the final riddle, Sugam! ♥ The mystery ends here. Head to the bedside drawer for your last surprise. Happy Birthday!");
 } else {
   fb.textContent=wrong;
   const inputEl=document.getElementById("answer");
   inputEl.focus();
 }
}
// These QR stages are located beside wrapped gifts; celebrate on arrival,
// not when the previous riddle is answered.
const giftCheckpoints = {
  3: "Excellent detective work! There is something waiting for you here. Unwrap it before continuing. ♥",
  5: "Another mystery solved! Take a moment to enjoy what you found. ✨",
  7: "You made it to another special checkpoint! A little surprise is yours. 🎁",

};
function launchCelebration(message){
  const overlay=document.getElementById("celebration");
  document.getElementById("party-message").textContent=message;
  overlay.querySelectorAll(".party-piece,.party-balloon").forEach(el=>el.remove());
  overlay.classList.add("active");
  document.getElementById("party-continue").focus();
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(let i=0;i<85;i++){
    const el=document.createElement("span");
    el.className="party-piece";
    el.textContent=["✦","●","◆","✨"][Math.floor(Math.random()*4)];
    el.style.color=["#d6b574","#fff6eb","#f3a4b5","#e9cf95"][Math.floor(Math.random()*4)];
    el.style.left=Math.random()*100+"%";
    el.style.fontSize=(10+Math.random()*16)+"px";
    el.style.animationDuration=(2.8+Math.random()*3)+"s";
    el.style.animationDelay=Math.random()*1.5+"s";
    overlay.appendChild(el);
    el.addEventListener("animationend",()=>el.remove());
  }
  for(let i=0;i<10;i++){
    const el=document.createElement("span");
    el.className="party-balloon";
    el.textContent="🎈";
    el.style.left=Math.random()*95+"%";
    el.style.fontSize=(27+Math.random()*24)+"px";
    el.style.animationDuration=(5+Math.random()*4)+"s";
    el.style.animationDelay=Math.random()*1.4+"s";
    overlay.appendChild(el);
    el.addEventListener("animationend",()=>el.remove());
  }
}
document.getElementById("party-continue").onclick=()=>{
  document.getElementById("celebration").classList.remove("active");
  document.getElementById("app").querySelector("input,button,a")?.focus();
};
if(stage>=1 && stage<=8){showStage(stage);} else {home();}
if(giftCheckpoints[stage])launchCelebration(giftCheckpoints[stage]);
</script>
</body>
</html>
